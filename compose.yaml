services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_DB: clinic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clinic-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  clinic-data:
